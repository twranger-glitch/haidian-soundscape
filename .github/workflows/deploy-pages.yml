name: Deploy GitHub Pages (ShadeMap secret injection)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site and inject ShadeMap key
        shell: bash
        env:
          SHADEMAP_API_KEY: ${{ secrets.SHADEMAP_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SHADEMAP_API_KEY:-}" ]]; then
            echo "::error::Missing SHADEMAP_API_KEY. Add it as a secret in the github-pages environment."
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          # Copy the public site, but never publish repository metadata, workflows,
          # the secret-free template, or a locally generated config file.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='config.shademap.template.js' \
            --exclude='config.shademap.js' \
            ./ _site/

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          placeholder = "__SHADEMAP_API_KEY_JSON__"
          template_path = Path("config.shademap.template.js")
          output_path = Path("_site/config.shademap.js")
          secret = os.environ.get("SHADEMAP_API_KEY", "")

          if not secret:
              raise SystemExit("SHADEMAP_API_KEY is empty")

          template = template_path.read_text(encoding="utf-8")
          if template.count(placeholder) != 1:
              raise SystemExit("ShadeMap key placeholder is missing or duplicated")

          rendered = template.replace(placeholder, json.dumps(secret))
          output_path.write_text(rendered, encoding="utf-8")
          PY

          # Only inspect the generated runtime config. Other repo files may
          # legitimately mention the placeholder as documentation/test text.
          if grep --fixed-strings '__SHADEMAP_API_KEY_JSON__' _site/config.shademap.js >/dev/null; then
            echo "::error::Unresolved ShadeMap key placeholder found in config.shademap.js."
            exit 1
          fi

          test -s _site/config.shademap.js

          # Syntax gate: never deploy a malformed runtime config.
          node --check _site/config.shademap.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
