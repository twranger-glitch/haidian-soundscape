name: Build building tiles (manual)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Coverage preset
        required: true
        default: tainan-city
        type: choice
        options:
          - tainan-city
          - tainan-metro
          - taiwan
      mode:
        description: What to do with the built dataset
        required: true
        default: build-and-publish
        type: choice
        options:
          - build-and-publish
          - build-artifact
          - plan
      overture_release:
        description: Overture release
        required: true
        default: 2026-08-19.0
        type: string
      data_version:
        description: Exact data version (blank = auto)
        required: false
        default: ""
        type: string
      max_cells:
        description: Optional smoke-test cell limit; 0 = all cells in preset
        required: true
        default: "0"
        type: string
      hf_repo_id:
        description: Hugging Face dataset repo (used only by build-and-publish)
        required: true
        default: yhzkiki/haidian-building-tiles
        type: string

permissions:
  contents: read

concurrency:
  group: building-data-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PRESET: ${{ inputs.preset }}
      MODE: ${{ inputs.mode }}
      OVERTURE_RELEASE: ${{ inputs.overture_release }}
      INPUT_DATA_VERSION: ${{ inputs.data_version }}
      MAX_CELLS: ${{ inputs.max_cells }}
      HF_REPO_ID: ${{ inputs.hf_repo_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb shapely pyproj huggingface_hub

      - name: Resolve build variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_DATA_VERSION}" ]]; then
            DATA_VERSION="${INPUT_DATA_VERSION}"
          else
            DATA_VERSION="${OVERTURE_RELEASE}-overture-${PRESET}-v1"
          fi
          echo "DATA_VERSION=${DATA_VERSION}" >> "$GITHUB_ENV"
          echo "OUT=build-output/${DATA_VERSION}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${DATA_VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Show runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h
          free -h || true
          python --version

      - name: Plan coverage
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --preset "$PRESET"
            --overture-release "$OVERTURE_RELEASE"
            --data-version "$DATA_VERSION"
            --out "$OUT"
            --plan-only
          )
          if [[ "${MAX_CELLS}" =~ ^[1-9][0-9]*$ ]]; then
            ARGS+=(--max-cells "$MAX_CELLS")
          fi
          python tools/build-building-coverage.py "${ARGS[@]}" | tee building-plan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: building-plan-${{ inputs.preset }}-${{ github.run_id }}
          path: building-plan.json
          retention-days: 7

      - name: Stop after plan
        if: ${{ inputs.mode == 'plan' }}
        run: echo "Plan-only run complete."

      - name: Build versioned tiles
        if: ${{ inputs.mode != 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --preset "$PRESET"
            --overture-release "$OVERTURE_RELEASE"
            --data-version "$DATA_VERSION"
            --out "$OUT"
          )
          if [[ "${MAX_CELLS}" =~ ^[1-9][0-9]*$ ]]; then
            ARGS+=(--max-cells "$MAX_CELLS")
          fi
          python tools/build-building-coverage.py "${ARGS[@]}"

      - name: Validate dataset
        if: ${{ inputs.mode != 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate-building-dataset.py --root "$OUT" --sample 120

      - name: Write build summary
        if: ${{ inputs.mode != 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          m = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          d = json.loads((root/'deployment-info.json').read_text(encoding='utf-8'))
          rows = [
              '# Building dataset build',
              '',
              f"- preset: `{m.get('latest_run', {}).get('preset')}`",
              f"- data version: `{m.get('data_version')}`",
              f"- features: **{m.get('feature_count', 0):,}**",
              f"- z16 tiles: **{m.get('tile_count', 0):,}**",
              f"- raw tile bytes: **{m.get('bytes', 0):,}**",
              f"- cells completed: **{m.get('latest_run', {}).get('cells_completed', 0)} / {m.get('latest_run', {}).get('cells_requested', 0)}**",
              f"- required worker: `{d.get('required_worker_minimum')}`",
              '',
              'Do not switch BUILDING_DATA_VERSION until this artifact has been checked in the live site.',
          ]
          Path('BUILD-SUMMARY.md').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(rows) + '\n')
          PY

      - name: Package dataset for downloadable artifact
        if: ${{ inputs.mode == 'build-artifact' }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C build-output -czf "$ARCHIVE" "$DATA_VERSION"
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload full dataset artifact
        if: ${{ inputs.mode == 'build-artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: building-dataset-${{ inputs.preset }}-${{ github.run_id }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            BUILD-SUMMARY.md
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: Require Hugging Face token
        if: ${{ inputs.mode == 'build-and-publish' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret HF_TOKEN."
            exit 1
          fi

      - name: Publish version directory to Hugging Face
        if: ${{ inputs.mode == 'build-and-publish' }}
        shell: bash
        run: |
          set -euo pipefail
          hf upload "$HF_REPO_ID" "$OUT" "buildings/$DATA_VERSION" \
            --repo-type dataset \
            --token "$HF_TOKEN" \
            --commit-message "Publish building tiles $DATA_VERSION"

      - name: Upload publication metadata
        if: ${{ inputs.mode == 'build-and-publish' }}
        uses: actions/upload-artifact@v4
        with:
          name: building-publication-${{ inputs.preset }}-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/manifest.json
            ${{ env.OUT }}/tile-index.json
            ${{ env.OUT }}/deployment-info.json
            ${{ env.OUT }}/build-state.json
            BUILD-SUMMARY.md
          retention-days: 14
          if-no-files-found: error

      - name: Final disk report
        if: ${{ always() }}
        run: df -h
