name: Build ShadeMap building tiles

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Area to build"
        required: true
        default: "haidian-smoke"
        type: choice
        options:
          - haidian-smoke
          - tainan
          - taiwan-all
      deploy_hf:
        description: "Publish validated tiles to Hugging Face Dataset"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install building pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install overturemaps shapely pyproj huggingface_hub
          
      - name: Ensure helper scripts are executable
        shell: bash
        run: |
          chmod +x tools/*.sh
          
      - name: Resolve Overture release
        id: overture
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(overturemaps releases latest | tail -n 1 | tr -d '[:space:]')"
          test -n "$RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Overture release: $RELEASE"

      - name: Build selected area
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          rm -rf _building-work _building-out
          mkdir -p _building-work _building-out
          if [[ "$SCOPE" == "taiwan-all" ]]; then
            for REGION in taiwan-main penghu kinmen matsu; do
              python tools/build-building-region.py \
                --preset "$REGION" \
                --out _building-out \
                --work "_building-work/$REGION" \
                --grid-zoom 11 \
                --tile-zoom 16 \
                --buffer-m 250 \
                --resume
            done
          else
            python tools/build-building-region.py \
              --preset "$SCOPE" \
              --out _building-out \
              --work "_building-work/$SCOPE" \
              --grid-zoom 11 \
              --tile-zoom 16 \
              --buffer-m 250
          fi
          python tools/check-building-dataset.py _building-out

      - name: Resolve immutable dataset version
        id: dataset
        shell: bash
        env:
          RELEASE: ${{ steps.overture.outputs.release }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE}-overture-osm-${SCOPE}-v2"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building dataset version: $VERSION"

      - name: Write deployment info
        shell: bash
        env:
          VERSION: ${{ steps.dataset.outputs.version }}
          SCOPE: ${{ inputs.scope }}
          HF_BUILDING_REPO: ${{ vars.HF_BUILDING_REPO }}
        run: |
          set -euo pipefail
          python - <<'PYINFO'
          import json, os
          from pathlib import Path
          repo = (os.environ.get("HF_BUILDING_REPO") or "").strip()
          version = os.environ["VERSION"]
          obj = {
              "schema": 1,
              "scope": os.environ["SCOPE"],
              "building_data_version": version,
              "hf_repo": repo or None,
              "building_hf_base_url": f"https://huggingface.co/datasets/{repo}/resolve/main/buildings" if repo else None,
              "worker_variables": {
                  "BUILDING_HF_BASE_URL": f"https://huggingface.co/datasets/{repo}/resolve/main/buildings" if repo else None,
                  "BUILDING_DATA_VERSION": version,
                  "BUILDING_CACHE_TTL_SECONDS": "2592000",
                  "BUILDING_BROWSER_MAX_AGE_SECONDS": "86400",
                  "BUILDING_UPSTREAM_TIMEOUT_MS": "8000"
              },
              "pilot_url_suffix": "?buildingPipeline=1"
          }
          Path("_building-out/deployment-info.json").write_text(json.dumps(obj, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PYINFO

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: building-tiles-${{ inputs.scope }}-${{ steps.dataset.outputs.version }}
          path: |
            _building-out/manifest.json
            _building-out/deployment-info.json
            _building-out/16/
            _building-out/cell-manifests/
          retention-days: 14
          compression-level: 6

      - name: Publish to Hugging Face Dataset
        if: ${{ inputs.deploy_hf }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUILDING_REPO: ${{ vars.HF_BUILDING_REPO }}
          HF_BUILDING_PRIVATE: ${{ vars.HF_BUILDING_PRIVATE }}
          VERSION: ${{ steps.dataset.outputs.version }}
        run: |
          set -euo pipefail
          : "${HF_TOKEN:?Set the HF_TOKEN repository secret to a Hugging Face write token}"
          : "${HF_BUILDING_REPO:?Set the HF_BUILDING_REPO repository variable, e.g. owner/haidian-building-tiles}"
          PRIVATE="${HF_BUILDING_PRIVATE:-false}"
          python tools/deploy-building-tiles-hf.py \
            _building-out \
            --repo-id "$HF_BUILDING_REPO" \
            --version "$VERSION" \
            --private "$PRIVATE"
          {
            echo "## Hugging Face building dataset published"
            echo ""
            echo "- Repo: \`$HF_BUILDING_REPO\`"
            echo "- BUILDING_DATA_VERSION: \`$VERSION\`"
            echo "- BUILDING_HF_BASE_URL: \`https://huggingface.co/datasets/$HF_BUILDING_REPO/resolve/main/buildings\`"
            echo "- Worker manifest check: \`/buildings/manifest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public Hugging Face manifest
        if: ${{ inputs.deploy_hf }}
        shell: bash
        env:
          HF_BUILDING_REPO: ${{ vars.HF_BUILDING_REPO }}
          VERSION: ${{ steps.dataset.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://huggingface.co/datasets/${HF_BUILDING_REPO}/resolve/main/buildings/${VERSION}/manifest.json"
          echo "Checking $URL"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 30 "$URL" -o /tmp/hf-building-manifest.json; then
              python - <<'PYVERIFY'
          import json
          from pathlib import Path
          p=Path('/tmp/hf-building-manifest.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if int(obj.get('tile_zoom', 0)) != 16:
              raise SystemExit('Published manifest does not report tile_zoom=16')
          if int(obj.get('tile_count', 0)) <= 0:
              raise SystemExit('Published manifest has no building tiles')
          print('HF public manifest OK:', obj.get('tile_count'), 'tiles /', obj.get('feature_count'), 'features')
          PYVERIFY
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Published Hugging Face manifest was not publicly readable after retries. Check that the Dataset repo is public."
          exit 1

